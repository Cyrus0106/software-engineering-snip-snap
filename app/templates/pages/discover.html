{% extends "base.html" %}

{% block styles %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/discover.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/searchAutocomplete.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/tagList.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/galleryGrid.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/userPromo.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/postImageCard.css') }}">
{% endblock %}

{% block content %}
  <div class="discover-page">  <!-- renamed wrapper -->
    <section class="discover-card">

      <div class="discover-header">
        <h1>Discover</h1>
        <p>Find the best barbers and cuts closest to you.</p>
      </div>

      <div class="discover-actions">
    <!-- Mount point for the SearchAutocomplete JS component -->
        <div id="searchBarMount" class="discover-search"></div>
   <!-- Mount point for the TagList JS component which shows active filters the customer has selected -->  
        <div id="tagListMount" class="discover-taglist"></div>
      </div>
  <!-- Mount point for the GalleryGrid JS component which renders the infinite scroll feed of barber post images -->
      <div id="postGalleryMount" class="galleryGrid" style="margin-top: 8px;">
        <!-- Skeleton placeholder shown while posts are loading-->
          <div id="gallerySkeleton" class="gallery-skeleton">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          </div>
      </div>
  <!-- Sentinel element, which triggers next batch of posts to load automatically -->
      <div id="postGallerySentinel"></div>

    </section>
  </div>
{% endblock %}

{% block scripts %}
  <script>
    window.__VIEWER_LOC__ = {{ viewer_loc|tojson }};
  </script>
<!-- Load the SearchAutocomplete component before the page module so it is available when discover.js initialises -->
  <script src="{{ url_for('static', filename='js/components/searchAutocomplete.js') }}"></script>
<!-- Main discover page module — initialises all components including the gallery grid, tag list and infinite scroll behaviour -->
  <script type="module" src="{{ url_for('static', filename='js/pages/discover.js') }}"></script>
{% endblock %}
